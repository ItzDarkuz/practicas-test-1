<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>Almacén Zapatillas - Órdenes</title>
  <link rel="stylesheet" href="css/styles.css" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

  <header>
    <div class="logo"><img src="img/logo.svg" alt="Logo Almacen Zapatillas" class="logo-img" /> Almacen Zapatillas</div>
    <nav>
      <a href="index.html">Dashboard</a>
      <a href="inventario.html">Inventario</a>
      <a href="almacen.html">Almacén</a>
      <a href="ordenes.html" class="active">Órdenes</a>
      <a href="movimientos.html">Movimientos</a>
      <a href="proveedores.html">Proveedores</a>
      <a href="clientes.html">Clientes</a>
      <a href="trabajadores.html">Trabajadores</a>
    </nav>
  </header>

  <main>
    <div class="page-header">
      <h1>Órdenes</h1>
      <button class="btn-primary" id="btn-nueva-orden">+ Nueva orden</button>
    </div>

    <section id="filtros">
      <div class="filtros-grid filtros-grid-2">
        <select id="filtro-tipo">
          <option value="">Tipo: Todos</option>
          <option value="INBOUND">INBOUND</option>
          <option value="OUTBOUND">OUTBOUND</option>
          <option value="TRANSFER">TRANSFER</option>
        </select>
        <select id="filtro-estado-orden">
          <option value="">Estado: Todos</option>
          <option value="PENDING">Pendiente</option>
          <option value="APPROVED">Aprobado</option>
          <option value="REJECTED">Rechazado</option>
        </select>
      </div>
    </section>

    <section id="tabla-ordenes-section">
      <table class="tabla-datos">
        <thead>
          <tr>
            <th>Fecha</th>
            <th>Tipo</th>
            <th>Proveedor / Cliente</th>
            <th>Almacén</th>
            <th>Artículos</th>
            <th>Estado</th>
            <th>Acciones</th>
          </tr>
        </thead>
        <tbody id="tabla-ordenes">
          <tr><td colspan="7">Cargando...</td></tr>
        </tbody>
      </table>
    </section>
  </main>

  <!-- Modal: nueva orden -->
  <dialog id="modal-orden">
    <form id="form-orden" class="form-orden">
      <h2>Nueva orden</h2>

      <label>Tipo de orden
        <select id="form-tipo" required>
          <option value="INBOUND">INBOUND (llega de un proveedor)</option>
          <option value="OUTBOUND">OUTBOUND (sale hacia un cliente/tienda)</option>
          <option value="TRANSFER">TRANSFER (traslado entre tus almacenes)</option>
        </select>
      </label>

      <label id="label-proveedor">Proveedor
        <select id="form-proveedor"></select>
      </label>

      <label id="label-cliente" style="display:none">Cliente / Tienda destino
        <select id="form-cliente"></select>
      </label>

      <label id="label-almacen-origen" style="display:none">Almacén de origen
        <select id="form-almacen-origen"></select>
      </label>

      <label id="label-almacen-destino">Almacén
        <select id="form-almacen-destino"></select>
      </label>

      <label>Trabajador responsable
        <select id="form-worker" required></select>
      </label>

      <h3>Artículos de la orden</h3>
      <div id="lista-items-orden"></div>
      <button type="button" id="btn-agregar-item" class="btn-link">+ Agregar artículo</button>

      <div class="modal-acciones">
        <button type="button" id="btn-cancelar-orden">Cancelar</button>
        <button type="submit" class="btn-primary">Crear orden</button>
      </div>
    </form>
  </dialog>

  <script src="js/supabaseClient.js"></script>
  <script src="js/ordenes.js"></script>

</body>
</html>
