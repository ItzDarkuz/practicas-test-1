<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>Almacén Zapatillas - Proveedores</title>
  <link rel="stylesheet" href="css/styles.css" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

  <header>
    <div class="logo"><img src="img/logo.svg" alt="Logo Almacen Zapatillas" class="logo-img" /> Almacen Zapatillas</div>
    <nav>
      <a href="index.html">Dashboard</a>
      <a href="inventario.html">Inventario</a>
      <a href="almacen.html">Almacén</a>
      <a href="ordenes.html">Órdenes</a>
      <a href="movimientos.html">Movimientos</a>
      <a href="proveedores.html" class="active">Proveedores</a>
      <a href="clientes.html">Clientes</a>
      <a href="trabajadores.html">Trabajadores</a>
    </nav>
  </header>

  <main>
    <div class="page-header">
      <h1>Proveedores</h1>
      <button class="btn-primary" id="btn-nuevo">+ Nuevo proveedor</button>
    </div>

    <section id="tabla-section">
      <table class="tabla-datos">
        <thead>
          <tr>
            <th>Nombre</th>
            <th>Contacto</th>
            <th>Registrado</th>
            <th>Acciones</th>
          </tr>
        </thead>
        <tbody id="tabla-proveedores">
          <tr><td colspan="4">Cargando...</td></tr>
        </tbody>
      </table>
    </section>
  </main>

  <dialog id="modal-proveedor">
    <form id="form-proveedor">
      <h2 id="modal-titulo">Nuevo proveedor</h2>
      <input type="hidden" id="form-id" />

      <label>Nombre
        <input type="text" id="form-name" required />
      </label>

      <label>Contacto (teléfono/email)
        <input type="text" id="form-contact" />
      </label>

      <div class="modal-acciones">
        <button type="button" id="btn-cancelar">Cancelar</button>
        <button type="submit" class="btn-primary">Guardar</button>
      </div>
    </form>
  </dialog>

  <script src="js/supabaseClient.js"></script>
  <script src="js/proveedores.js"></script>

</body>
</html>
